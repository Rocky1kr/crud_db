<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ post.title }}</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: #1a1d1e;
        color: #e8eaea;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .card {
        border: 1px solid #3a3f41;
        border-radius: 10px;
        overflow: hidden;
      }
      .card-title {
        margin: 0;
        padding: 16px;
        font-size: 30px;
        border-bottom: 1px solid #3a3f41;
      }
      .card-content {
        margin: 0;
        padding: 24px 16px;
        font-size: 16px;
        line-height: 1.7;
        white-space: pre-wrap;
        min-height: 160px;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
      }
      .actions-right {
        display: flex;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        padding: 10px 18px;
        background: #e8ecf4;
        color: #1a1d1e;
        border: none;
        border-radius: 8px;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #fff;
      }
      .btn-sub {
        background: #2a2f31;
        color: #a0a6a8;
      }
      .btn-sub:hover {
        background: #23272a;
        color: #e8eaea;
      }
      .btn-danger {
        background: #2a2f31;
        color: #ff4d4f;
      }
      .btn-danger:hover {
        background: #23272a;
      }
      form {
        margin: 0;
      }
      .comments {
        margin-top: 32px;
      }
      .comments-title {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .comment-list {
        list-style: none;
        margin: 0 0 16px;
        padding: 0;
        border: 1px solid #3a3f41;
        border-radius: 10px;
        overflow: hidden;
      }
      .comment-item {
        padding: 14px 16px;
        border-bottom: 1px solid #2c3032;
        font-size: 16px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
      .comment-item:last-child {
        border-bottom: none;
      }
      .comment-item:hover {
        background: #23272a;
      }
      .comment-empty {
        padding: 24px;
        text-align: center;
        color: #a0a6a8;
        font-size: 14px;
      }
      .comment-form textarea {
        width: 100%;
        min-height: 90px;
        margin-bottom: 12px;
        padding: 12px 14px;
        background: #23272a;
        color: #e8eaea;
        border: 1px solid #3a3f41;
        border-radius: 8px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.6;
        resize: vertical;
      }
      .comment-form textarea:focus {
        outline: none;
        border-color: #e8ecf4;
      }
      .comment-form .actions {
        justify-content: flex-end;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1 class="card-title">{{ post.title }}</h1>
        <p class="card-content">{{ post.content }}</p>
      </div>

      <div class="actions">
        <a class="btn btn-sub" href="/posts">← 게시판으로 이동</a>
        <div class="actions-right">
          <a class="btn" href="/posts/{{post.id}}/edit">수정하기</a>
          <form action="/posts/{{post.id}}/delete" method="post">
            <input class="btn btn-danger" type="submit" value="삭제하기" />
          </form>
        </div>
      </div>

      <div class="comments">
        <h2 class="comments-title">댓글 {{ comments|length }}</h2>

        <ul class="comment-list">
          {% for comment in comments %}
          <li class="comment-item">{{ comment.content }}</li>
          {% else %}
          <li class="comment-empty">아직 댓글이 없어요.</li>
          {% endfor %}
        </ul>

        <form class="comment-form" action="/posts/{{post.id}}/comments" method="post">
          <textarea name="content" placeholder="댓글을 입력하세요" required></textarea>
          <div class="actions">
            <input class="btn" type="submit" value="댓글 등록" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
