<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ post.title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
    <link href="/static/css/board.css" rel="stylesheet" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body class="board-body">
    <div class="board-wrap mx-auto">
      <div class="board-topbar">
        <a class="board-back" href="/posts">← 게시판으로 돌아가기</a>
        <button type="button" class="btn board-btn-sub" id="board-theme-toggle">
          ☀️ 라이트 모드
        </button>
      </div>

      <header class="board-head">
        <h1 class="board-display board-display-md">{{ post.title }}</h1>
      </header>

      <p class="board-post-content">{{ post.content }}</p>

      <div class="board-actions">
        <a class="btn board-btn-sub" href="/posts/{{post.id}}/edit">수정하기</a>
        <form class="m-0" action="/posts/{{post.id}}/delete" method="post">
          <input class="btn board-btn-danger" type="submit" value="삭제하기" />
        </form>
      </div>

      <section class="board-comments">
        <h2 class="board-h2">댓글 {{ comments|length }}개</h2>

        <ul class="list-unstyled board-comment-list">
          {% for comment in comments %}
          <li class="board-comment-item">{{ comment.content }}</li>
          {% else %}
          <li class="board-empty">아직 댓글이 없어요. 첫 댓글을 남겨 보세요.</li>
          {% endfor %}
        </ul>

        <form action="/posts/{{post.id}}/comments" method="post">
          <label class="visually-hidden" for="comment">댓글</label>
          <textarea
            class="form-control board-input board-comment-textarea mb-3"
            id="comment"
            name="content"
            placeholder="댓글을 입력하세요"
            required
          ></textarea>
          <div class="d-flex justify-content-end">
            <input class="btn board-btn" type="submit" value="댓글 등록" />
          </div>
        </form>
      </section>
    </div>
  </body>
</html>
