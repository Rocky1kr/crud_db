<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ post.title }}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/board.css" rel="stylesheet" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body class="board-body">
    <div class="board-wrap mx-auto">
      <div class="d-flex justify-content-end mb-3">
        <button type="button" class="btn board-btn-sub" id="board-theme-toggle">
          ☀️ 라이트 모드
        </button>
      </div>

      <div class="board-card">
        <h1 class="board-post-title m-0">{{ post.title }}</h1>
        <p class="board-post-content m-0">{{ post.content }}</p>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-3">
        <a class="btn board-btn-sub" href="/posts">← 게시판으로 이동</a>
        <div class="d-flex gap-2">
          <a class="btn board-btn" href="/posts/{{post.id}}/edit">수정하기</a>
          <form class="m-0" action="/posts/{{post.id}}/delete" method="post">
            <input class="btn board-btn-danger" type="submit" value="삭제하기" />
          </form>
        </div>
      </div>

      <div class="mt-5">
        <h2 class="board-h2 mb-3">댓글 {{ comments|length }}</h2>

        <ul class="list-unstyled board-card mb-3">
          {% for comment in comments %}
          <li class="board-comment-item">{{ comment.content }}</li>
          {% else %}
          <li class="board-comment-empty text-center">아직 댓글이 없어요.</li>
          {% endfor %}
        </ul>

        <form action="/posts/{{post.id}}/comments" method="post">
          <textarea
            class="form-control board-input board-comment-textarea mb-3"
            name="content"
            placeholder="댓글을 입력하세요"
            required
          ></textarea>
          <div class="d-flex justify-content-end">
            <input class="btn board-btn" type="submit" value="댓글 등록" />
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
