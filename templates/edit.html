<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글 수정</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
    <link href="/static/css/board.css" rel="stylesheet" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body class="board-body">
    <div class="board-wrap mx-auto">
      <header class="board-head">
        <h1 class="board-display board-display-lg">글 수정</h1>
        <button type="button" class="btn board-btn-sub" id="board-theme-toggle">
          ☀️ 라이트 모드
        </button>
      </header>

      <form class="board-form" action="/posts/{{post.id}}/update" method="post">
        <div class="mb-4">
          <label class="form-label board-label" for="title">제목</label>
          <input
            class="form-control board-input"
            type="text"
            id="title"
            name="title"
            value="{{post.title}}"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label board-label" for="content">내용</label>
          <textarea
            class="form-control board-input board-textarea"
            id="content"
            name="content"
            required
          >{{post.content}}</textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn board-btn-sub" href="/posts/{{post.id}}">취소</a>
          <input class="btn board-btn" type="submit" value="수정 완료" />
        </div>
      </form>
    </div>
  </body>
</html>
