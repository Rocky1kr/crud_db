<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px 16px;
        background: #1a1d1e;
        color: #e8eaea;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 18px;
        background: #e8ecf4;
        color: #1a1d1e;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #fff;
      }
      .board {
        border: 1px solid #3a3f41;
        border-radius: 10px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        padding: 12px 16px;
        font-size: 14px;
        font-weight: normal;
        color: #a0a6a8;
        text-align: left;
        border-bottom: 1px solid #3a3f41;
      }
      th.num,
      td.num {
        width: 90px;
        text-align: center;
      }
      tbody td {
        padding: 14px 16px;
        border-bottom: 1px solid #2c3032;
      }
      tbody tr:last-child td {
        border-bottom: none;
      }
      tbody tr:hover {
        background: #23272a;
      }
      .badge {
        display: inline-block;
        min-width: 52px;
        padding: 4px 0;
        background: #2a2f31;
        color: #a0a6a8;
        border-radius: 999px;
        font-size: 13px;
        text-align: center;
      }
      .title-link {
        color: #e8eaea;
        text-decoration: none;
        font-size: 16px;
      }
      .title-link:hover {
        text-decoration: underline;
      }
      .new {
        margin-left: 6px;
        color: #ff4d4f;
        font-size: 11px;
        font-weight: bold;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>게시판</h1>
        <a class="btn" href="/posts/new">✏️ 글쓰기</a>
      </div>

      <div class="board">
        <table>
          <thead>
            <tr>
              <th class="num">번호</th>
              <th>제목</th>
            </tr>
          </thead>
          <tbody>
            {% for post in posts %}
            <tr>
              <td class="num"><span class="badge">{{ post.id }}</span></td>
              <td>
                <a class="title-link" href="/posts/{{post.id}}"
                  >{{ post.title }}</a
                >
              </td>
            </tr>
            {% else %}
            <tr>
              <td colspan="2" class="empty">아직 글이 없어요.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
