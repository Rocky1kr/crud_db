<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/board.css" rel="stylesheet" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body class="board-body">
    <div class="board-wrap mx-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="board-h1 m-0">게시판</h1>
        <div class="d-flex gap-2">
          <button type="button" class="btn board-btn-sub" id="board-theme-toggle">
            ☀️ 라이트 모드
          </button>
          <a class="btn board-btn" href="/posts/new">✏️ 글쓰기</a>
        </div>
      </div>

      <div class="board-card">
        <table class="table table-hover board-table mb-0">
          <thead>
            <tr>
              <th class="board-num">번호</th>
              <th>제목</th>
            </tr>
          </thead>
          <tbody>
            {% for post in posts %}
            <tr>
              <td class="board-num">
                <span class="badge rounded-pill board-badge">{{ post.id }}</span>
              </td>
              <td>
                <a class="board-title-link" href="/posts/{{post.id}}"
                  >{{ post.title }}</a
                >
              </td>
            </tr>
            {% else %}
            <tr>
              <td colspan="2" class="text-center board-empty">아직 글이 없어요.</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </body>
</html>
