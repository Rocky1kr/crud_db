<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게시판</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap"
      rel="stylesheet"
    />
    <link href="/static/css/board.css" rel="stylesheet" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body class="board-body">
    <div class="board-wrap mx-auto">
      <header class="board-head">
        <div>
          <h1 class="board-display board-display-xl">게시판</h1>
          <p class="board-head-sub">글 {{ posts|length }}개</p>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn board-btn-sub" id="board-theme-toggle">
            ☀️ 라이트 모드
          </button>
          <a class="btn board-btn" href="/posts/new">✏️ 글쓰기</a>
        </div>
      </header>

      <table class="table board-list-table">
        <thead class="visually-hidden">
          <tr>
            <th>번호</th>
            <th>제목</th>
          </tr>
        </thead>
        <tbody>
          {% for post in posts %}
          <tr class="board-list-row position-relative">
            <td class="board-list-num">{{ post.id }}</td>
            <td>
              <a class="board-list-link stretched-link" href="/posts/{{post.id}}"
                >{{ post.title }}</a
              >
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="2" class="board-empty">
              <p class="mb-3">아직 글이 없어요.</p>
              <a class="btn board-btn" href="/posts/new">첫 글 쓰기</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </body>
</html>
