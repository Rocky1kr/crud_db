<!doctype html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>글쓰기</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/static/css/board.css" rel="stylesheet" />
    <script src="/static/js/theme.js"></script>
  </head>
  <body class="board-body">
    <div class="board-wrap mx-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="board-h1 m-0">글쓰기</h1>
        <button type="button" class="btn board-btn-sub" id="board-theme-toggle">
          ☀️ 라이트 모드
        </button>
      </div>
      <form class="board-card p-3" action="/posts/create" method="post">
        <div class="mb-4">
          <label class="form-label board-label" for="title">제목</label>
          <input
            class="form-control board-input"
            type="text"
            id="title"
            name="title"
            required
          />
        </div>

        <div class="mb-4">
          <label class="form-label board-label" for="content">내용</label>
          <textarea
            class="form-control board-input board-textarea"
            id="content"
            name="content"
            required
          ></textarea>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a class="btn board-btn-sub" href="/posts">취소</a>
          <input class="btn board-btn" type="submit" value="등록" />
        </div>
      </form>
    </div>
  </body>
</html>
